name: Build & Release WakePilot

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  go-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run Go E2EE, Relay & Agent tests
        run: go test -v ./...

      - name: Build Linux Blind Relay & Windows Agent
        run: |
          mkdir -p artifacts
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o artifacts/wakepilot-relay-linux-amd64 ./server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o artifacts/wakepilot-agent.exe ./windows-agent

      - uses: actions/upload-artifact@v4
        with:
          name: wakepilot-go-binaries
          path: artifacts/*

  android-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run Android JVM tests & build Debug APK
        working-directory: android-app
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wakepilot-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go-test-and-build, android-test-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/wakepilot-go-binaries/wakepilot-relay-linux-amd64
            release-files/wakepilot-go-binaries/wakepilot-agent.exe
            release-files/wakepilot-android-apk/app-debug.apk
